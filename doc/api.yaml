openapi: 3.0.3
info:
  title: WASAText API
  description: API for the WASAText messaging application.
  version: "1.0.0"

servers:
  - url: http://localhost:3000 

#logical endpoints grouping for better documentation and client generation
tags:           
  - name: login
  - name: users
  - name: conversations
  - name: groups
  - name: messages
  - name: comments

#all endpoints require bearerAuth authentication by default
#after login, user will use the returned identifier as Bearer token in the Authorization header for all subsequent requests. The API will use this token to identify the user and authorize access to resources.
security:
  - bearerAuth: []

#endpoints
paths:
  
  #login endpoint, which also serves as registration since a new user is created if the provided username does not exist. This is the only endpoint that does not require authentication, since it's used to obtain the token in the first place.
  /session:
    post:
      tags: [login]
      summary: Log in or register a user
      description: >
        If the username does not exist, it is created and the user is logged in.
        If the username already exists, the user is logged in.
        The returned identifier must be used in the Authorization header as Bearer token.
      operationId: doLogin
      security: [] #only endpoint that does not require authentication, since it's used to obtain the token in the first place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #users endpoints for retrieving all user profiles, optionally filtered by username substring
  /users:
    get:
      tags: [users]
      summary: List users
      description: Returns all existing WASAText users, optionally filtered by username.
      operationId: listUsers
      parameters:
        - name: username
          in: query
          required: false
          description: Filter users by username substring
          schema:
            type: string
            minLength: 1
            maxLength: 16
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #returns current user profile based on the provided Bearer token, which is used to identify the user
  /users/me:
    get:
      tags: [users]
      summary: Get current user profile
      operationId: getMyProfile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the current user's username
  /users/me/name:
    put:
      tags: [users]
      summary: Update my username
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserNameRequest"
      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the current user's profile photo
  /users/me/photo:
    put:
      tags: [users]
      summary: Update my profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Profile photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid photo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for retrieving the current user's conversations, sorted by latest activity (get)
  #and for creating a new conversation, either direct or group. For direct conversations, only one member (other than the creator) should be specified. For group conversations, at least one member should be specified and a name is required (post)
  /conversations:
    get:
      tags: [conversations]
      summary: Get my conversations
      description: Returns the current user's conversations sorted by latest activity.
      operationId: getMyConversations
      responses:
        "200":
          description: Conversations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    
    post:
      tags: [conversations]
      summary: Create a new conversation
      description: Creates either a direct conversation or a group conversation.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more users not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for retrieving a conversation with all its messages. The user must be a member of the conversation to access it
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      summary: Get a conversation with all messages
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for sending a new message in a conversation. The user must be a member of the conversation to send messages in it
  /conversations/{conversationId}/messages:
    post:
      tags: [messages]
      summary: Send a new message
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for marking a message as read
  /messages/{messageId}/read:
    put:
      tags: [messages]
      summary: Mark a message as read
      operationId: markMessageAsRead
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message marked as read
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for forwarding an existing message to another conversation. The user must be a member of both the source and destination conversations to forward messages between them
  /messages/{messageId}/forward:
    post:
      tags: [messages]
      summary: Forward a message
      operationId: forwardMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message or destination conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for deleting a sent message. Only the sender can delete a message, and it will be marked as deleted but not removed from the conversation history to preserve the context of replies and forwards
  /messages/{messageId}:
    delete:
      tags: [messages]
      summary: Delete one of my sent messages
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the sender can delete the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for adding a reaction/comment to a message. The user must be a member of the conversation to which the message belongs to comment on it
  /messages/{messageId}/comments:
    post:
      tags: [comments]
      summary: Add a reaction/comment to a message
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentMessageRequest"
      responses:
        "201":
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for removing a reaction/comment from a message. Only the comment author can remove it
  /messages/{messageId}/comments/{commentId}:
    delete:
      tags: [comments]
      summary: Remove one of my reactions/comments from a message
      operationId: uncommentMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Comment removed successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the comment author can remove it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for adding a user to a group conversation
  /groups/{groupId}/members:
    post:
      tags: [groups]
      summary: Add a user to a group
      operationId: addToGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToGroupRequest"
      responses:
        "200":
          description: User added to group successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already belongs to the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint that allows tha authenticated user to leave a group conversation they are a member of
  /groups/{groupId}/members/me:
    delete:
      tags: [groups]
      summary: Leave a group
      operationId: leaveGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Left group successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the name of a group conversation. The user must be a member of the group to update its name
  /groups/{groupId}/name:
    put:
      tags: [groups]
      summary: Update group name
      operationId: setGroupName
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupNameRequest"
      responses:
        "200":
          description: Group name updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid group name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the photo of a group conversation. The user must be a member of the group to update its photo
  /groups/{groupId}/photo:
    put:
      tags: [groups]
      summary: Update group photo
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Group photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid photo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UserIdentifier

  #standard input parameters that are reused across multiple endpoints to avoid repetition and ensure consistency in parameter definitions
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation identifier
      schema:
        type: string
        minLength: 1

    GroupId:
      name: groupId
      in: path
      required: true
      description: Group conversation identifier
      schema:
        type: string
        minLength: 1

    MessageId:
      name: messageId
      in: path
      required: true
      description: Message identifier
      schema:
        type: string
        minLength: 1

    CommentId:
      name: commentId
      in: path
      required: true
      description: Comment identifier
      schema:
        type: string
        minLength: 1

  schemas:

    #loginRequest schema represents the payload for the login endpoint, which also serves as registration
    #It requires a username that must be between 3 and 16 characters long and can contain any character (pattern '^.*?$' allows all characters)
    LoginRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Maria
          pattern: '^.*?$'
          minLength: 3
          maxLength: 16

    LoginResponse:
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: string
          example: "abcdef012345"

    #schema that creates an object for updating the user's username
    #the username must be between 3 and 16 characters long and can only contain letters, numbers, and underscores (pattern '^[A-Za-z0-9_]+$')
    UpdateUserNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 16
          pattern: '^[A-Za-z0-9_]+$'
          example: new_username
    
    #schema that creates an object for updating the user's photo
    UpdatePhotoRequest:
      type: object
      required:
        - photo
      properties:
        photo:
          $ref: "#/components/schemas/photo"

    #schema that creates a reusable definition for a photo field, which can be used for both user profile photos and group conversation photos
    #the photo is represented as a string that can be either a URL or a local path, and it is nullable to allow users or groups without a photo
    photo:
      type: string
      nullable: false
      description: URL or local path of the profile/group photo
      example: "/static/users/user123.png"

    #schema that creates an object for creating a new conversation, either direct or group.
    #for direct conversations, only one member (other than the creator) should be specified. For group conversations, at least one member should be specified and a name is required
    CreateConversationRequest:
      type: object
      required:
        - members
        - isGroup
      properties:
        isGroup:
          type: boolean
          example: false
        name:
          type: string
          description: Required only for group conversations
          minLength: 1
          maxLength: 32
          example: Study Group
        photo:
          $ref: "#/components/schemas/photo"
        members:
          type: array
          minItems: 1
          items:
            type: string
          example: ["user_001"]

    #schema that creates an object for sending a new message in a conversation
    #The message type can be text, gif, or image, and the content is a string that represents the message content
    #For text messages, the content is the text itself
    #For gif and image messages, the content is a URL string representing the media
    #The replyToMessageId field is optional and can be used to indicate that this message is a reply to another message in the conversation
    SendMessageRequest:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [text, gif, image]
          example: text
        content:
          type: string
          minLength: 1
          example: Hello!
        replyToMessageId:
          type: string
          nullable: true
          example: "msg_001"

    #schema that creates an object for forwarding an existing message to another conversation
    ForwardMessageRequest:
      type: object
      required:
        - conversationId
      properties:
        conversationId:
          type: string
          example: "conv_002"

    #schema that creates an object for adding a reaction to a message
    CommentMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Emoticon or short reaction text
          minLength: 1
          maxLength: 32
          example: "😀"

    #schema that creates an object for adding a user to a group conversation
    AddToGroupRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          example: "user789"

    #schema that creates an object for updating the name of a group conversation
    UpdateGroupNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          example: New Group Name

    #schema representing a user profile. The photo field is nullable to allow users without a profile picture
    User:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          example: "user_001"
        username:
          type: string
          example: "Maria"
        photo:
          $ref: "#/components/schemas/photo"

    #schema representing a list of users, used for responses that return multiple user profiles
    UserList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    #schema representing a conversation summary, which includes basic information about the conversation and a preview of the last message
    ConversationSummary:
      type: object
      required:
        - id
        - isGroup
        - title
        - updatedAt
      properties:
        id:
          type: string
          example: "conv_001"
        isGroup:
          type: boolean
          example: false
        title:
          type: string
          example: "Luca"
        photo:
          $ref: "#/components/schemas/photo"
        updatedAt:
          type: string
          format: date-time
        lastMessage:
          $ref: "#/components/schemas/ConversationPreview"

    #schema representing a preview of a conversation's last message, used in the conversation summary
    ConversationPreview:
      type: object
      properties:
        type:
          type: string
          enum: [text, gif, image]
          example: text
        snippet:
          type: string
          nullable: true
          example: "See you later"
        senderId:
          type: string
          example: "user_001"
        createdAt:
          type: string
          format: date-time

    #schema representing a list of conversation summaries, used for responses that return the current user's conversations
    ConversationSummaryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"

    #schema representing a conversation with all its messages. The user must be a member of the conversation to access it
    Conversation:
      type: object
      required:
        - id
        - isGroup
        - members
        - messages
      properties:
        id:
          type: string
          example: "conv_001"
        isGroup:
          type: boolean
          example: true
        name:
          type: string
          nullable: true
          example: "Study Group"
        photo:
          $ref: "#/components/schemas/photo"
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    #schema representing a message in a conversation, which can be of type text, gif, or image
    #the content field represents the message content, which is either the text itself for text messages or a URL string for media messages
    #the message also includes metadata such as the sender, creation time, delivery and read status, and any comments/reactions associated with it
    Message:
      type: object
      required:
        - id
        - conversationId
        - senderId
        - type
        - content
        - createdAt
        - status
        - comments
      properties:
        id:
          type: string
          example: "msg_001"
        conversationId:
          type: string
          example: "conv_001"
        senderId:
          type: string
          example: "user_001"
        senderUsername:
          type: string
          example: "Maria"
        type:
          type: string
          enum: [text, gif, image]
          example: text
        content:
          type: string
          example: "Hello everyone"
        replyToMessageId:
          type: string
          nullable: true
          example: "msg_000"
        forwardedFromMessageId:
          type: string
          nullable: true
          example: "msg_777"
        createdAt:
          type: string
          format: date-time
        deleted:
          type: boolean
          example: false
        status:
          $ref: "#/components/schemas/MessageStatus"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    #schema representing the delivery and read status of a message, indicating whether it has been delivered to all conversation members and whether it has been read by all members
    MessageStatus:
      type: object
      required:
        - deliveredToAll
        - readByAll
      properties:
        deliveredToAll:
          type: boolean
          example: true
        readByAll:
          type: boolean
          example: false

    #schema representing a comment added to a message, which includes the comment content, the author, and the creation time
    Comment:
      type: object
      required:
        - id
        - messageId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
          example: "comm_001"
        messageId:
          type: string
          example: "msg_001"
        authorId:
          type: string
          example: "user_001"
        authorUsername:
          type: string
          example: "Luca"
        content:
          type: string
          example: "😀"
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "invalid request"