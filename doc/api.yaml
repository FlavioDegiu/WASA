openapi: 3.0.3
info:
  title: WASAText API
  description: API for the WASAText messaging application.
  version: "1.0.2"

servers:
  - url: http://localhost:3000 

#logical endpoints grouping for better documentation and client generation
tags:           
  - name: login
  - name: users
  - name: conversations
  - name: groups
  - name: messages
  - name: comments

#all endpoints require bearerAuth authentication by default
#after login, user will use the returned identifier as Bearer token in the Authorization header for all subsequent requests. The API will use this token to identify the user and authorize access to resources.
security:
  - bearerAuth: []

#endpoints
paths:
  
  #login endpoint, which also serves as registration since a new user is created if the provided username does not exist. This is the only endpoint that does not require authentication, since it's used to obtain the token in the first place.
  /session:
    post:
      tags: [login]
      summary: Log in or register a user
      description: >
        If the username does not exist, it is created and the user is logged in.
        If the username already exists, the user is logged in.
        The returned identifier must be used in the Authorization header as Bearer token.
      operationId: doLogin
      security: [] #only endpoint that does not require authentication, since it's used to obtain the token in the first place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "201":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #users endpoints for retrieving all user profiles, optionally filtered by username substring
  /users:
    get:
      tags: [users]
      summary: List users
      description: Returns all existing WASAText users, optionally filtered by username.
      operationId: listUsers
      parameters:
        - name: username
          in: query
          required: false
          description: Filter users by username substring
          schema:
            type: string
            minLength: 1
            maxLength: 16
            pattern: '^.+$'
      responses:
        "200":
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #returns current user profile based on the provided Bearer token, which is used to identify the user
  /users/me:
    get:
      tags: [users]
      summary: Get current user profile
      description: Get current user profile
      operationId: getMyProfile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the current user's username
  /users/me/name:
    put:
      tags: [users]
      summary: Update my username
      description: Update my username
      operationId: setMyUserName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserNameRequest"
      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the current user's profile photo
  /users/me/photo:
    put:
      tags: [users]
      summary: Update my profile photo
      description: Update my profile photo
      operationId: setMyPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Profile photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid photo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for retrieving the current user's conversations, sorted by latest activity (get)
  #and for creating a new conversation, either direct or group. For direct conversations, only one member (other than the creator) should be specified. For group conversations, at least one member should be specified and a name is required (post)
  /conversations:
    get:
      tags: [conversations]
      summary: Get my conversations
      description: Returns the current user's conversations sorted by latest activity.
      operationId: getMyConversations
      responses:
        "200":
          description: Conversations retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummaryList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    
    post:
      tags: [conversations]
      summary: Create a new conversation
      description: Creates either a direct conversation or a group conversation.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more users not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for retrieving a conversation with all its messages. The user must be a member of the conversation to access it
  /conversations/{conversationId}:
    get:
      tags: [conversations]
      summary: Get a conversation with all messages
      description: Get a conversation with all messages
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for sending a new message in a conversation. The user must be a member of the conversation to send messages in it
  /conversations/{conversationId}/messages:
    post:
      tags: [messages]
      summary: Send a new message
      description: Send a new message (text, image, gif)
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for marking a message as read
  /messages/{messageId}/read:
    put:
      tags: [messages]
      summary: Mark a message as read
      description: Mark a message as read
      operationId: markMessageAsRead
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message marked as read
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for forwarding an existing message to another conversation. The user must be a member of both the source and destination conversations to forward messages between them
  /messages/{messageId}/forward:
    post:
      tags: [messages]
      summary: Forward a message
      description: Forward a message
      operationId: forwardMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessageRequest"
      responses:
        "201":
          description: Message forwarded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message or destination conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for deleting a sent message. Only the sender can delete a message, and it will be marked as deleted but not removed from the conversation history to preserve the context of replies and forwards
  /messages/{messageId}:
    delete:
      tags: [messages]
      summary: Delete one of my sent messages
      description: Delete one of my sent messages (mark as deleted)
      operationId: deleteMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Message deleted successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the sender can delete the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for adding a reaction/comment to a message. The user must be a member of the conversation to which the message belongs to comment on it
  /messages/{messageId}/comments:
    post:
      tags: [comments]
      summary: Add a reaction/comment to a message
      description: Add a reaction emoticon to a message
      operationId: commentMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentMessageRequest"
      responses:
        "201":
          description: Comment added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Invalid comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for removing a reaction/comment from a message. Only the comment author can remove it
  /messages/{messageId}/comments/{commentId}:
    delete:
      tags: [comments]
      summary: Remove one of my reactions/comments from a message
      description: Remove one of my reactions emoticons from a message
      operationId: uncommentMessage
      parameters:
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Comment removed successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Only the comment author can remove it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for adding a user to a group conversation
  /groups/{groupId}/members:
    post:
      tags: [groups]
      summary: Add a user to a group
      description: Add a user to a group he is not in
      operationId: addToGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToGroupRequest"
      responses:
        "200":
          description: User added to group successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid request or user is not in the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already belongs to the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint that allows tha authenticated user to leave a group conversation they are a member of
  /groups/{groupId}/members/me:
    delete:
      tags: [groups]
      summary: Leave a group
      description: Leave a group the user is a part of
      operationId: leaveGroup
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204":
          description: Left group successfully
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the name of a group conversation. The user must be a member of the group to update its name
  /groups/{groupId}/name:
    put:
      tags: [groups]
      summary: Update group name
      description: Update group name
      operationId: setGroupName
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupNameRequest"
      responses:
        "200":
          description: Group name updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid group name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  #endpoint for updating the photo of a group conversation. The user must be a member of the group to update its photo
  /groups/{groupId}/photo:
    put:
      tags: [groups]
      summary: Update group photo
      description: Update group photo
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/GroupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePhotoRequest"
      responses:
        "200":
          description: Group photo updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid photo payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UserIdentifier

  #standard input parameters that are reused across multiple endpoints to avoid repetition and ensure consistency in parameter definitions
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: Conversation identifier
      schema:
        type: string
        minLength: 4
        maxLength: 64
        pattern: '^.+$'

    GroupId:
      name: groupId
      in: path
      required: true
      description: Group conversation identifier
      schema:
        type: string
        minLength: 4
        maxLength: 64
        pattern: '^.+$'

    MessageId:
      name: messageId
      in: path
      required: true
      description: Message identifier
      schema:
        type: string
        minLength: 4
        maxLength: 64
        pattern: '^.+$'

    CommentId:
      name: commentId
      in: path
      required: true
      description: Comment identifier
      schema:
        type: string
        minLength: 4
        maxLength: 64
        pattern: '^.+$'

  schemas:

    #loginRequest schema represents the payload for the login endpoint, which also serves as registration
    #It requires a username that must be between 3 and 16 characters long and can contain any character (pattern '^.*?$' allows all characters)
    LoginRequest:
      type: object
      description: represents the payload for the login endpoint, which also serves as registration
      required:
        - name
      properties:
        name:
          type: string
          description: the username of the user that is logging in/registering. Can contain any character
          example: Maria_1604
          pattern: '^.*?$'
          minLength: 3
          maxLength: 16

    #loginResponse schema that represents the object for the unique access identifier
    LoginResponse:
      type: object
      description: represents the payload for the login response, which gives the unique access identifier
      required:
        - identifier
      properties:
        identifier:
          type: string
          description: unique access identifier object
          example: "abcdef012345"
          pattern: '^.+$'
          minLength: 1
          maxLength: 64

    #schema that creates an object for updating the user's username
    #the username must be between 3 and 16 characters long and can contain any character (pattern '^.*?$' allows all characters)
    UpdateUserNameRequest:
      type: object
      description: represents the payload for updating a user's username
      required:
        - name
      properties:
        name:
          type: string
          description: the new username of the user. Can contain any character
          minLength: 3
          maxLength: 16
          pattern: '^.*?$'
          example: Maria_1604
    
    #schema that creates an object for updating the user's photo
    UpdatePhotoRequest:
      type: object
      description: schema that creates an object for updating the user's photo
      required:
        - photo
      properties:
        photo:
          $ref: "#/components/schemas/photo"

    #schema that creates a reusable definition for a photo field, which can be used for both user profile photos and group conversation photos
    #the photo is represented as a string that can be either a URL or a local path, and it is nullable to allow users or groups without a photo
    photo:
      type: string
      minLength: 1
      maxLength: 512
      description: URL or local path of the profile/group photo
      example: "/static/users/user123.png"
      pattern: '^(https?://.+|/.+)$'

    #schema that creates an object for creating a new conversation, either direct or group.
    #for direct conversations, only one member (other than the creator) should be specified. For group conversations, at least one member should be specified and a name is required
    CreateConversationRequest:
      type: object
      description: schema that creates an object for creating a new conversation, either direct or group.
      required:
        - members
        - isGroup
      properties:
        isGroup:
          type: boolean
          description: true if the new chat is a group chat
          example: false
        name:
          type: string
          description: The name of the group chat. Required only for group conversations
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          example: Study Group
        photo:
          $ref: "#/components/schemas/photo"
        members:
          type: array
          description: the array that contains the list of the users in the chat (one if direct chat, one or more if group chat)
          minItems: 1
          maxItems: 16
          items:
            type: string
            description: the id of a user that is in the chat
            pattern: '^.*?$'
            minLength: 1
            maxLength: 64
          example: ["user_001"]

    #schema that creates an object for sending a new message in a conversation
    #The message type can be text, gif, or image, and the content is a string that represents the message content
    #For text messages, the content is the text itself
    #For gif and image messages, the content is a URL string representing the media
    #The replyToMessageId field is optional and can be used to indicate that this message is a reply to another message in the conversation
    SendMessageRequest:
      type: object
      description: object for sending a new message in a conversation
      required:
        - type
        - content
      properties:
        type:
          type: string
          pattern: '[a-z]'
          minLength: 3
          maxLength: 5
          description: the type of message that has been sent (text, gif, image)
          enum: [text, gif, image]
          example: text
        content:
          type: string
          pattern: '^.*?$'
          description: the content of the message
          minLength: 1
          maxLength: 4096
          example: Hello!
        replyToMessageId:
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 64
          description: the id of the message that this message is replying to. Null if this message does not reply to any other message
          example: "msg_001"

    #schema that creates an object for forwarding an existing message to another conversation
    ForwardMessageRequest:
      type: object
      description: object for forwarding an existing message to another conversation
      required:
        - conversationId
      properties:
        conversationId:
          type: string
          minLength: 1
          maxLength: 64
          description: the id of the conversation the forwarded message is being sent to
          pattern: '^.*?$'
          example: "conv_002"

    #schema that creates an object for adding a reaction to a message
    CommentMessageRequest:
      type: object
      description: object for adding a reaction to a message
      required:
        - content
      properties:
        content:
          type: string
          description: Emoticon
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          example: "😀"

    #schema that creates an object for adding a user to a group conversation
    AddToGroupRequest:
      type: object
      description: object for adding a user to a group conversation
      required:
        - userId
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the user to be added to the group chat
          example: "user_001"

    #schema that creates an object for updating the name of a group conversation
    UpdateGroupNameRequest:
      type: object
      description: object for updating the name of a group conversation
      required:
        - name
      properties:
        name:
          type: string
          description: the new name of the group conversation
          minLength: 1
          maxLength: 32
          example: New Group Name
          pattern: '^.*?$'

    #schema representing a user profile. The photo field is nullable to allow users without a profile picture
    User:
      type: object
      description: user profile
      required:
        - id
        - username
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: the user id
          pattern: '^.*?$'
          example: "user_001"
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: the username
          pattern: '^.*?$'
          example: "Maria_1604"
        photo:
          $ref: "#/components/schemas/photo"

    #schema representing a list of users, used for responses that return multiple user profiles
    UserList:
      type: object
      description: a list of users
      required:
        - items
      properties:
        items:
          type: array
          description: an array of user objects
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/User"

    #schema representing a conversation summary, which includes basic information about the conversation and a preview of the last message
    ConversationSummary:
      type: object
      description: conversation summary, which includes basic information about the conversation and a preview of the last message
      required:
        - id
        - isGroup
        - title
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: the id of the conversation
          pattern: '^.*?$'
          example: "conv_001"
        isGroup:
          type: boolean
          description: true if the conversation is a group conversation
          example: false
        title:
          type: string
          minLength: 1
          maxLength: 64
          example: "Luca"
          description: the name of the conversation
          pattern: '^.*?$'
        photo:
          $ref: "#/components/schemas/photo"
        updatedAt:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          description: the timestamp of the last message in the conversation
          format: date-time
        lastMessage:
          $ref: "#/components/schemas/ConversationPreview"

    #schema representing a preview of a conversation's last message, used in the conversation summary
    ConversationPreview:
      type: object
      description: preview of a conversation's last message, used in the conversation summary
      required: 
        - type
        - senderId
        - createdAt
      properties:
        type:
          type: string
          minLength: 3
          maxLength: 5
          pattern: '[a-z]'
          description: the type of the last message (text, gif, image)
          enum: [text, gif, image]
          example: text
        content:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: '^.*?$'
          description: a short version of the content of the last message
          example: "See you later"
        senderId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the user if of the sender of the last message
          example: "user_001"
        createdAt:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          description: timestamp of the last message in the conversation
          format: date-time

    #schema representing a list of conversation summaries, used for responses that return the current user's conversations
    ConversationSummaryList:
      type: object
      description: list of conversation summaries, used for responses that return the current user's conversations
      required:
        - items
      properties:
        items:
          type: array
          description: an array of conversation summaries
          minItems: 0
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ConversationSummary"

    #schema representing a conversation with all its messages. The user must be a member of the conversation to access it
    Conversation:
      type: object
      description: conversation with all its messages
      required:
        - id
        - isGroup
        - members
        - messages
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the conversation
          example: "conv_001"
        isGroup:
          type: boolean
          description: true if the conversation is a group conversation
          example: true
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the name of the conversation
          example: "Study Group"
        photo:
          $ref: "#/components/schemas/photo"
        members:
          type: array
          minItems: 0
          maxItems: 16
          description: an array of users members of the conversation
          items:
            $ref: "#/components/schemas/User"
        messages:
          type: array
          description: an array of messages sent in the conversation
          minItems: 0
          maxItems: 4096
          items:
            $ref: "#/components/schemas/Message"

    #schema representing a message in a conversation, which can be of type text, gif, or image
    #the content field represents the message content, which is either the text itself for text messages or a URL string for media messages
    #the message also includes metadata such as the sender, creation time, delivery and read status, and any comments/reactions associated with it
    Message:
      type: object
      description: message in a conversation
      required:
        - id
        - conversationId
        - senderId
        - type
        - content
        - createdAt
        - status
        - comments
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the message
          example: "msg_001"
        conversationId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the conversation the message is in
          example: "conv_001"
        senderId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the user id of the sender of the message
          example: "user_001"
        senderUsername:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the username of the sender of the message
          example: "Maria-0327"
        type:
          type: string
          minLength: 3
          maxLength: 5
          pattern: '[a-z]'
          description: the type of the message (text, gif, image)
          enum: [text, gif, image]
          example: text
        content:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^.*?$'
          description: the content of the message
          example: "Hello everyone"
        replyToMessageId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the message that this message is replying to. Null if not replying to any message
          example: "msg_000"
        forwardedFromMessageId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the message that this message is being forwarded from. Null if not forwarded from any message
          example: "msg_777"
        createdAt:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          description: timestamp for when this message has been sent
          format: date-time
        deleted:
          type: boolean
          description: true if this message has been deleted from the sender
          example: false
        status:
          $ref: "#/components/schemas/MessageStatus"
        comments:
          type: array
          description: an array of comments that are attached to this message
          minItems: 0
          maxItems: 16
          items:
            $ref: "#/components/schemas/Comment"

    #schema representing the delivery and read status of a message, indicating whether it has been delivered to all conversation members and whether it has been read by all members
    MessageStatus:
      type: object
      description: delivery and read status of a message, indicating whether it has been delivered to all conversation members and whether it has been read by all members
      required:
        - deliveredToAll
        - readByAll
      properties:
        deliveredToAll:
          description: true if delivered by all the conversation members
          type: boolean
          example: true
        readByAll:
          type: boolean
          description: true if read by all the conversation members
          example: false

    #schema representing a comment added to a message, which includes the comment content, the author, and the creation time
    Comment:
      type: object
      description: comment added to a message
      required:
        - id
        - messageId
        - authorId
        - content
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the comment
          example: "comm_001"
        messageId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the message this comment is attached to
          example: "msg_001"
        authorId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the id of the user that attached this comment
          example: "user_001"
        authorUsername:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^.*?$'
          description: the username of the user that attached this comment
          example: "Luca"
        content:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          description: the comment (Emoticon)
          example: "😀"
        createdAt:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^.*?$'
          description: the timestamp at wich this comment was added
          format: date-time

    Error:
      type: object
      description: an error object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^.*?$'
          description: the string that explains the error
          example: "invalid request"